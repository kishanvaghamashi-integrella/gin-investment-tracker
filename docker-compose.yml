services:
  postgres:
    image: postgres:18.4
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - proxy
    volumes:
      - investmenet_tracker_volume:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: investment-tracker-migrate
    networks:
      - proxy
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GOOSE_MIGRATION_DIR: /migrations
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  investment-tracker:
    build:
      context: .
    container_name: investment-tracker
    networks:
      - proxy
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Kolkata
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  proxy:
    external: true

volumes:
  investmenet_tracker_volume:
